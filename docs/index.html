<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Truyện Panda & Paw Patrol</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:#1a1423; color:#fff7ea; }
  body { overflow:hidden; }

  /* ============ LIBRARY ============ */
  #library { position:fixed; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:linear-gradient(160deg,#1a1423 0%,#241a36 50%,#1a2740 100%); padding:26px 16px 56px; }
  #library.hidden { display:none; }
  .lib-head { text-align:center; margin-bottom:24px; }
  .lib-head h1 { font-size:clamp(21px,5vw,32px); font-weight:800; }
  .lib-head p { margin-top:7px; color:#c9bfe0; font-size:clamp(13px,2.4vw,15px); }
  .grid { max-width:1080px; margin:0 auto; display:grid; gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
  .card { cursor:pointer; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
    border-radius:16px; overflow:hidden; display:flex; flex-direction:column;
    transition:transform .18s, box-shadow .18s, background .18s; }
  .card:hover,.card:active { transform:translateY(-4px); background:rgba(255,255,255,.09);
    box-shadow:0 12px 32px rgba(0,0,0,.45); }
  .thumb { position:relative; aspect-ratio:5/7; background:#0e0a17; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .num { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.6); backdrop-filter:blur(4px);
    font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; }
  .cap { padding:11px 12px; font-size:13.5px; line-height:1.4; font-weight:600; flex:1; }

  /* ============ READER ============ */
  #reader { position:fixed; inset:0; display:none; background:#1a1423; }
  #reader.active { display:block; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage img { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px;
    box-shadow:0 8px 40px rgba(0,0,0,.6); animation:fadeIn .6s ease; }
  @keyframes fadeIn { from{opacity:0;transform:scale(.985);} to{opacity:1;transform:scale(1);} }

  .tapzone { position:absolute; top:0; bottom:0; width:28%; z-index:5; cursor:pointer; }
  #tapPrev { left:0; } #tapNext { right:0; }

  #caption { position:fixed; left:50%; transform:translateX(-50%); bottom:86px;
    max-width:min(92vw,700px); max-height:32vh; overflow-y:auto;
    background:rgba(20,14,30,.82); backdrop-filter:blur(8px); color:#fff7ea;
    font-size:clamp(15px,2.2vmin,19px); line-height:1.55; padding:14px 18px; border-radius:14px;
    z-index:6; display:none; white-space:pre-wrap; }
  #reader.show-caption #caption { display:block; }

  /* top-left back button */
  #btnHome { position:fixed; top:12px; left:12px; z-index:11; border:none; border-radius:999px;
    background:rgba(0,0,0,.55); backdrop-filter:blur(6px); color:#fff; font-size:14px; font-weight:600;
    padding:9px 16px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  #btnHome:active { transform:scale(.94); }

  #bar { position:fixed; left:0; right:0; bottom:0; height:76px; z-index:10;
    display:flex; align-items:center; justify-content:center; gap:14px;
    background:linear-gradient(transparent, rgba(10,6,16,.85) 40%); }
  #bar button { border:none; border-radius:50%; width:48px; height:48px; background:rgba(255,255,255,.12);
    color:#fff; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s, transform .1s; }
  #bar button:active { transform:scale(.92); }
  #bar button:hover { background:rgba(255,255,255,.25); }
  #btnPlay { width:60px !important; height:60px !important; font-size:26px !important; background:#ff7a2f !important; }
  #pageNum { color:#ffd9b3; font-size:15px; min-width:64px; text-align:center; font-variant-numeric:tabular-nums; }

  #dots { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:7px; z-index:10;
    max-width:70vw; flex-wrap:wrap; justify-content:center; }
  #dots span { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.25); cursor:pointer; transition:all .2s; }
  #dots span.done { background:rgba(255,170,90,.55); }
  #dots span.cur { background:#ff7a2f; transform:scale(1.35); }

  .overlay { position:fixed; inset:0; z-index:50; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:24px; text-align:center; padding:24px; }
  .overlay.show { display:flex; }
  #startOverlay { background:radial-gradient(ellipse at center,#3b2a55 0%,#1a1423 75%); }
  #startOverlay h1 { color:#ffe9cf; font-size:clamp(22px,4.5vmin,36px); max-width:80vw; line-height:1.3; text-shadow:0 3px 16px rgba(0,0,0,.5); }
  #startOverlay .sub { color:#bda8d8; font-size:clamp(14px,2.2vmin,18px); }
  #startCover { width:min(38vh,68vw); border-radius:12px; box-shadow:0 10px 50px rgba(0,0,0,.7); }
  .bigbtn { border:none; background:linear-gradient(135deg,#ff8c42,#ff5e3a); color:#fff;
    font-size:clamp(17px,3vmin,22px); font-weight:700; padding:15px 40px; border-radius:999px;
    cursor:pointer; box-shadow:0 6px 26px rgba(255,110,60,.45); transition:transform .12s; }
  .bigbtn:active { transform:scale(.95); }
  #endOverlay { background:rgba(18,12,28,.92); backdrop-filter:blur(6px); }
  #endOverlay h2 { color:#ffe9cf; font-size:clamp(22px,4vmin,32px); }
  .end-row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .end-row .bigbtn.alt { background:rgba(255,255,255,.14); box-shadow:none; }
  .toggle { display:flex; align-items:center; gap:10px; cursor:pointer; color:#e8dcff;
    font-size:clamp(14px,2.2vmin,17px); font-weight:600; user-select:none; }
  .toggle input { position:absolute; opacity:0; width:0; height:0; }
  .toggle .slider { position:relative; width:48px; height:27px; border-radius:999px; flex:none;
    background:rgba(255,255,255,.22); transition:background .2s; }
  .toggle .slider::before { content:""; position:absolute; top:3px; left:3px; width:21px; height:21px;
    border-radius:50%; background:#fff; transition:transform .2s; }
  .toggle input:checked + .slider { background:#ff7a2f; }
  .toggle input:checked + .slider::before { transform:translateX(21px); }
  #autoNextCountdown { color:#ffd9b3; font-size:clamp(14px,2.4vmin,18px); min-height:1.5em;
    font-weight:600; text-align:center; }

  /* Keep the artwork and narration in separate regions on touch-sized screens. */
  @media (max-width:1100px) {
    #reader.active { display:flex; flex-direction:column; height:100vh; height:100dvh;
      padding:56px 0 calc(76px + env(safe-area-inset-bottom)); }
    #stage { position:relative; inset:auto; flex:1 1 auto; min-height:0; width:100%; padding:0 8px 8px; }
    #stage img { max-height:100%; max-width:100%; }
    #caption { position:relative; left:auto; bottom:auto; transform:none; flex:0 0 auto;
      width:100%; max-width:none; max-height:clamp(190px,33dvh,320px);
      padding:18px max(20px,calc((100vw - 720px)/2)) 20px; border-radius:16px 16px 0 0;
      background:#292333; color:#fffaf2; font-size:20px; line-height:1.55;
      -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
    #bar { background:#1a1423; }
  }
  @media (min-width:701px) and (max-width:1100px) and (orientation:landscape) {
    #reader.active { flex-direction:row; padding:56px 0 calc(76px + env(safe-area-inset-bottom)); }
    #stage { width:55%; padding:0 12px; }
    #caption { flex:1 1 45%; width:auto; max-height:none; min-height:0;
      align-self:stretch; margin:0 16px 0 0; padding:20px 24px; border-radius:16px; }
  }
  @media (max-width:700px) {
    #reader.active { padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
    #caption { padding:16px 18px 20px; font-size:18px; }
    #bar { height:calc(72px + env(safe-area-inset-bottom));
      padding:0 8px env(safe-area-inset-bottom); gap:clamp(4px,1.5vw,10px);
      background:#1a1423; }
    #bar button { width:42px; height:42px; font-size:18px; flex:0 0 auto; }
    #btnPlay { width:52px !important; height:52px !important; font-size:22px !important; }
    #pageNum { min-width:64px; font-size:14px; }
  }
</style>
</head>
<body>

<!-- ============ LIBRARY VIEW ============ -->
<div id="library">
  <div class="lib-head">
    <h1>📚 Truyện Panda &amp; Paw Patrol</h1>
    <p>Chạm vào một truyện để nghe kể chuyện &amp; xem hình</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- ============ READER VIEW ============ -->
<div id="reader" class="show-caption">
  <div id="stage">

    <div id="tapNext" class="tapzone"></div>
  </div>

  <div id="dots"></div>
  <button id="btnHome">‹ Thư viện</button>
  <div id="bar">
    <button id="btnPrev" title="Trang trước">⏮</button>
    <button id="btnPlay" title="Phát / Dừng">▶</button>
    <button id="btnNext" title="Trang sau">⏭</button>
    <span id="pageNum"></span>
    <button id="btnReplay" title="Đọc lại trang này">🔁</button>

  <div id="startOverlay" class="overlay">
    <img id="startCover" alt="bìa truyện">

  </div>

  <div id="endOverlay" class="overlay">
    <h2>🎉 Hết truyện rồi! Bé giỏi lắm!</h2>
    <label class="toggle"><input type="checkbox" id="chkAutoNext"><span class="slider"></span><span>Tự động mở truyện tiếp theo</span></label>
    <div id="autoNextCountdown"></div>
    <div class="end-row">
      <button id="btnAgain" class="bigbtn">📖 Đọc lại</button>
      <button id="btnNextStory" class="bigbtn">➡️ Truyện tiếp theo</button>
      <button id="btnLibrary" class="bigbtn alt">📚 Chọn truyện khác</button>
    </div>
  </div>
</div>

<script>
const STORIES = [{"n":1,"title":"Panda và bí mật trên mặt hồ","voiceLabel":"ElevenLabs · v4 · tốc độ tự nhiên","base":"Panda-story-1","cover":"cover.webp","slides":[{"image":"cover.webp","audio":"elevenlabs-v4/audio/00-cover.mp3","text":"Panda và bí mật trên mặt hồ. Hôm nay, Panda cùng Chase và Skye học cách quan sát, tìm bằng chứng và kiểm tra điều mình dự đoán."},{"image":"page1.webp","audio":"elevenlabs-v4/audio/01.mp3","text":"Sáng nay, Panda mang chiếc thuyền buồm đồ chơi tự làm đến hồ nhỏ ở Vịnh Phiêu Lưu. Thân thuyền màu vàng, cánh buồm xanh lam và lá cờ đỏ bé xíu trên đỉnh. Chase và Skye đến xem. Panda vui vẻ nói: “Tớ muốn thử xem thuyền đi được bao xa!”"},{"image":"page2.webp","audio":"elevenlabs-v4/audio/02.mp3","text":"Panda đặt thuyền xuống nước. Nó lướt đi rất đẹp. Bỗng một cơn gió thổi qua, mặt hồ gợn sóng. Chiếc thuyền nghiêng nhẹ rồi khuất sau bụi lau bên bờ đối diện. Panda nhìn mãi vẫn không thấy nó trở ra."},{"image":"page3.webp","audio":"elevenlabs-v4/audio/03.mp3","text":"“Ôi, thuyền chìm mất rồi!” Panda kêu lên. Chase nhìn mặt nước và hỏi: “Cậu đã thấy nó chìm xuống chưa?” Panda lắc đầu. Cậu chỉ thấy chiếc thuyền biến mất sau bụi lau. Chase đề nghị: “Vậy mình hãy tìm thêm dấu hiệu trước đã.”"},{"image":"page4.webp","audio":"elevenlabs-v4/audio/04.mp3","text":"Skye bay trực thăng lên vừa đủ cao để nhìn qua bụi lau. Cô thấy một chấm đỏ nhỏ thấp thoáng sau những thân cây, nhưng không nhìn rõ đó có phải lá cờ của thuyền không. Skye báo xuống: “Có một vật màu đỏ ở phía sau bụi lau. Mình cần kiểm tra gần hơn!”"},{"image":"page5.webp","audio":"elevenlabs-v4/audio/05.mp3","text":"Panda nhìn những chiếc lá nổi trên hồ. Chúng không trôi thẳng; dòng nước đẩy chúng vòng theo bờ rồi rẽ vào phía sau bụi lau. Panda thả một chiếc lá khác ở gần chỗ chiếc thuyền biến mất. Chiếc lá cũng đi theo đúng đường ấy. Panda nói: “Nếu thuyền còn nổi, nó có thể trôi vào đó!”"},{"image":"page6.webp","audio":"elevenlabs-v4/audio/06.mp3","text":"Cả nhóm đi theo lối khô ven hồ. Skye chỉ vị trí lá cờ đỏ từ trên cao. Chase đứng vững trên bờ và dùng chiếc kẹp cơ khí từ ba lô cứu hộ kéo nhẹ con thuyền đang mắc giữa hai thân lau vào bờ. Thân vàng và buồm xanh hiện ra nguyên vẹn. Panda reo lên: “Đúng là thuyền của tớ!”"},{"image":"page7.webp","audio":"elevenlabs-v4/audio/07.mp3","text":"Panda cầm chiếc thuyền, ngắm phần đáy vẫn khô bên trong. Cậu nói: “Lúc nãy tớ đoán nó chìm, nhưng tớ không thật sự nhìn thấy.” Chase gật đầu: “Một điều mình đoán có thể đúng hoặc sai. Quan sát thêm sẽ giúp mình biết rõ hơn.” Skye cười: “Và thử bằng chiếc lá đã giúp chúng ta kiểm tra hướng nước chảy!”"},{"image":"page8.webp","audio":"elevenlabs-v4/audio/08.mp3","text":"Panda chọn một chỗ nước yên, xa bụi lau, để thả thuyền lần nữa. Trước khi buông tay, cậu nhìn hướng gió và những chiếc lá đang trôi. Panda nói: “Lần này tớ quan sát trước rồi mới đoán thuyền sẽ đi đâu.” Ba người cùng theo dõi con thuyền lướt trên mặt hồ."},{"image":"page9.webp","audio":"elevenlabs-v4/audio/09.mp3","text":"Bài học cho bé. Một, đừng vội kết luận chỉ từ một dấu hiệu. Hai, hãy nói rõ điều mình đã nhìn thấy và tìm thêm manh mối. Ba, thử kiểm tra dự đoán của mình. Nếu có thông tin mới, mình có thể đổi ý. Đó là cách học hỏi rất thông minh!"}]},{"n":2,"title":"Panda và bản đồ trường mới","voiceLabel":"ElevenLabs · v4 · tốc độ tự nhiên","base":"Panda-story-2","cover":"cover.webp","slides":[{"image":"cover.webp","audio":"elevenlabs-v4/audio/00-cover.mp3","text":"Panda và bản đồ trường mới. Hôm nay, Panda cùng các bạn khám phá: làm quen trường lớp, đọc ký hiệu và hỏi khi chưa rõ."},{"image":"page1.webp","audio":"elevenlabs-v4/audio/01.mp3","text":"Sáng thứ bảy, Bố Mẹ đưa Panda đến thăm ngôi trường cậu sẽ học lớp Một. Ryder và Rocky đang giúp cô lao công sắp xếp góc sách ở sân trường. Panda muốn tìm lớp học, thư viện và sân chơi trước khi về. “Con sẽ tự vẽ một bản đồ!” cậu nói, mở cuốn sổ nhỏ."},{"image":"page2.webp","audio":"elevenlabs-v4/audio/02.mp3","text":"Từ cổng, Panda nhìn thấy sân có cây phượng lớn. Cậu vẽ một ô vuông làm cổng, một vòng tròn đỏ làm cây phượng và một đường cong là lối đi. Mẹ hỏi: “Con sẽ làm sao để người khác biết vòng tròn ấy là cây?” Panda vẽ thêm chiếc lá nhỏ bên cạnh ký hiệu."},{"image":"page3.webp","audio":"elevenlabs-v4/audio/03.mp3","text":"Cả nhóm đến một ngã rẽ. Một mũi tên có hình quyển sách, mũi kia có hình chiếc bút. Panda đoán thư viện ở phía quyển sách. Nhưng đi qua một cửa kính, cậu thấy những kệ sách và nhiều bàn học. “Đây là thư viện chứ?” cậu băn khoăn."},{"image":"page4.webp","audio":"elevenlabs-v4/audio/04.mp3","text":"Panda không vội ghi vào bản đồ. Cậu lịch sự hỏi cô lao công đang ở gần đó. Cô giải thích: phòng có kệ sách là lớp học có góc đọc; thư viện ở cuối hành lang bên trái. Hình chiếc bút chỉ dãy phòng học, còn hình quyển sách chỉ đường vòng dẫn đến thư viện. “À, mình đã thiếu một đoạn đường!” Panda nói và sửa nét vẽ."},{"image":"page5.webp","audio":"elevenlabs-v4/audio/05.mp3","text":"Rocky nhìn cuốn sổ, rồi đi theo đúng các ký hiệu Panda vẽ. Cún dừng ở trước một cánh cửa màu xanh. “Tớ tưởng đây là thư viện, nhưng cửa này lại là phòng nhạc!” Panda nhận ra mình đã vẽ cánh cửa xanh vào sai chỗ. Cậu đếm lại hai cửa từ ngã rẽ và chuyển ký hiệu sang vị trí đúng."},{"image":"page6.webp","audio":"elevenlabs-v4/audio/06.mp3","text":"Ryder đề nghị Panda dẫn đường đến sân chơi mà không nhìn bảng chỉ dẫn. Panda nhìn bản đồ: qua cây phượng, rẽ phải ở bồn hoa rồi đi thẳng. Bố Mẹ đi phía sau để cậu tự thử. Cả nhóm đến đúng sân chơi với chiếc cầu trượt vàng. Panda vui đến mức nhảy hai bước."},{"image":"page7.webp","audio":"elevenlabs-v4/audio/07.mp3","text":"Panda đưa bản đồ cho Bố. Bố đọc theo ký hiệu và tìm được đường từ sân chơi đến lớp học. Mẹ chỉ vào khoảng trống cạnh thư viện: “Nếu con tô thêm lối nối này, người mới đến có đi được không?” Panda vẽ nốt lối nối và thêm một chú giải nhỏ bằng hình, không cần viết nhiều chữ."},{"image":"page8.webp","audio":"elevenlabs-v4/audio/08.mp3","text":"Trước khi ra về, Panda gấp bản đồ bỏ vào cặp. Cậu không nhớ hết mọi ngóc ngách, nhưng đã biết cổng, lớp, thư viện và sân chơi nằm ở đâu. “Nếu ngày đầu con chưa chắc, con có thể nhìn bản đồ hoặc hỏi người lớn ở trường,” cậu nói. Bố Mẹ mỉm cười; Ryder và Rocky vẫy chào."},{"image":"page9.webp","audio":"elevenlabs-v4/audio/09.mp3","text":"Bài học cho bé. Một, vẽ ký hiệu rõ ràng. Hai, hỏi khi chưa chắc. Ba, kiểm tra đường đi và sửa bản đồ nếu cần. Hỏi để hiểu rõ là một cách học rất giỏi."}]},{"n":3,"title":"Những viên gạch biết đếm","voiceLabel":"ElevenLabs · v4 · tốc độ tự nhiên","base":"Panda-story-3","cover":"cover.webp","slides":[{"image":"cover.webp","audio":"elevenlabs-v4/audio/00-cover.mp3","text":"Những viên gạch biết đếm. Hôm nay, Panda cùng các bạn khám phá: đếm, so sánh số lượng và cùng giải quyết vấn đề."},{"image":"page1.webp","audio":"elevenlabs-v4/audio/01.mp3","text":"Bố đưa Panda đến sân chơi nơi Rubble và Marshall đang dựng một đường vượt chướng ngại bằng các viên gạch xốp mềm. Đường có ba đoạn: bước qua ô vuông, đi qua cầu thấp rồi chạm cờ đích. Panda muốn tự sắp đoạn ô vuông cho các bạn nhỏ cùng chơi."},{"image":"page2.webp","audio":"elevenlabs-v4/audio/02.mp3","text":"Panda xếp hai hàng gạch xốp xanh, mỗi hàng bốn viên. Nhưng sau hàng thứ hai, còn một khoảng trống trước cờ đích. “Chúng ta thiếu gạch rồi!” Marshall kêu lên. Rubble định đi tìm thêm, nhưng Panda xin cả nhóm chờ một chút để đếm lại."},{"image":"page3.webp","audio":"elevenlabs-v4/audio/03.mp3","text":"Panda chạm từng viên và đếm: “Một, hai, ba, bốn. Hàng sau cũng bốn.” Cậu đặt bốn hòn sỏi bên cạnh mỗi hàng làm dấu, rồi thấy trong thùng còn hai viên gạch vàng. “Tất cả là mười viên. Nếu làm hai hàng năm viên, mình sẽ tới gần cờ hơn!” cậu nói."},{"image":"page4.webp","audio":"elevenlabs-v4/audio/04.mp3","text":"Rubble giúp chuyển thành hai hàng năm viên. Cả nhóm đi thử. Đường gần tới cờ hơn thật, nhưng giữa hai hàng có một khe quá rộng cho bước chân ngắn của Panda. Cậu dừng lại, không cố nhảy. “Đủ số viên chưa chắc đã an toàn,” Panda nhận xét."},{"image":"page5.webp","audio":"elevenlabs-v4/audio/05.mp3","text":"Bố hỏi Panda muốn đo khe bằng gì. Cậu thử đặt một bàn chân sát mép, rồi cùng Marshall so sánh các khoảng cách. Panda nhận thấy nếu xếp gạch thành một đường zíc zắc, mỗi bước chỉ cách nhau một bàn chân nhỏ. Cậu vẽ đường đi bằng ngón tay trên cát trước khi chuyển gạch."},{"image":"page6.webp","audio":"elevenlabs-v4/audio/06.mp3","text":"Rubble đẩy thùng gạch xốp đến gần bằng xe xúc, nhưng tắt máy rồi cùng mọi người xếp bằng tay và chân chó an toàn. Panda chia việc: Bố đặt viên đầu, cậu đặt viên tiếp, Marshall kiểm tra các khe, Rubble giữ thùng không lăn. Họ vừa xếp vừa đếm lại đủ mười viên."},{"image":"page7.webp","audio":"elevenlabs-v4/audio/07.mp3","text":"Panda đi qua từng viên gạch theo đường zíc zắc. Đến viên cuối, cậu chạm được cờ mà không phải nhảy xa. Marshall cũng thử bằng bốn chân chó; Rubble đi vòng bên ngoài vì người cún to hơn. Panda hiểu rằng cùng một đường có thể cần cách đi khác nhau cho mỗi bạn."},{"image":"page8.webp","audio":"elevenlabs-v4/audio/08.mp3","text":"Bố và Panda đặt tấm biển vẽ hình bàn chân nhỏ chỉ đường dành cho các bé; Rubble tạo lối rộng riêng cho cún. Marshall mời các bạn thử, còn Panda đếm nhịp vui vẻ: “Một bước, rồi một bước nữa!” Bố giơ ngón cái. Panda cười: “Đếm giúp mình biết có bao nhiêu; thử đi giúp mình biết cách xếp có ổn không.”"},{"image":"page9.webp","audio":"elevenlabs-v4/audio/09.mp3","text":"Bài học cho bé. Khi một cách chưa hiệu quả, hãy đếm và sắp xếp lại để tìm cách khác. Sau đó thử trong thực tế, chú ý sự an toàn và nhu cầu của từng người. Cùng làm việc, cùng kiểm tra thì trò chơi vui hơn."}]},{"n":4,"title":"Trạm thời tiết tí hon","voiceLabel":"ElevenLabs · v4 · tốc độ tự nhiên","base":"Panda-story-4","cover":"cover.webp","slides":[{"image":"cover.webp","audio":"elevenlabs-v4/audio/00-cover.mp3","text":"Trạm thời tiết tí hon. Hôm nay, Panda cùng các bạn khám phá: quan sát thời tiết, dự đoán có điều kiện và linh hoạt đổi kế hoạch."},{"image":"page1.webp","audio":"elevenlabs-v4/audio/01.mp3","text":"Mẹ và Panda định tổ chức trò săn kho báu bằng vỏ sò ở bãi cát Vịnh Phiêu Lưu. Skye mang một dải ruy băng hồng để đánh dấu điểm bắt đầu, còn Zuma chuẩn bị chiếc xô cam đựng vỏ sò. Trời có nắng nhạt; Panda háo hức đặt tờ bản đồ kho báu lên bàn dã ngoại."},{"image":"page2.webp","audio":"elevenlabs-v4/audio/02.mp3","text":"Một cơn gió kéo dải ruy băng căng về phía biển. Panda giữ chặt tờ bản đồ. Xa xa, đám mây xám đang tới. “Chắc chắn sắp mưa rồi!” cậu nói. Mẹ hỏi: “Con thấy những dấu hiệu nào? Mình có thể theo dõi thêm một chút không?”"},{"image":"page3.webp","audio":"elevenlabs-v4/audio/03.mp3","text":"Mẹ cùng Panda đặt một chong chóng giấy trong chiếc cốc cát, đánh dấu chiều gió bằng mũi tên trên sổ. Panda ghi thêm hình mặt trời bị mây che một nửa. Skye nhìn từ trên cao và báo: mây tập trung ngoài khơi, nhưng bãi cát vẫn khô. Zuma kiểm tra mép nước, nhắc mọi người đứng cách xa sóng."},{"image":"page4.webp","audio":"elevenlabs-v4/audio/04.mp3","text":"Panda nghĩ: nếu mây tiếp tục tới gần và gió mạnh hơn, cả nhóm sẽ chuyển trò chơi vào mái hiên. Nếu trời vẫn khô và gió dịu, họ có thể chơi ở phần cát cao, xa nước. Cậu vẽ hai đường khác nhau trên bản đồ. “Mình không cần đoán chắc một điều khi chưa đủ dấu hiệu,” Panda nói."},{"image":"page5.webp","audio":"elevenlabs-v4/audio/05.mp3","text":"Vài phút sau, chong chóng quay nhanh hơn. Những giọt mưa đầu tiên rơi xuống bàn. Panda hơi tiếc vì chưa tìm được vỏ sò đầu tiên. Cậu tự gấp bản đồ, cùng Mẹ cất giấy vào túi và gọi Skye, Zuma vào mái hiên gần đó. Không ai chạy ra bãi cát nữa."},{"image":"page6.webp","audio":"elevenlabs-v4/audio/06.mp3","text":"Panda nhìn chiếc xô cam trống rồi nảy ra ý mới: dùng những tấm thẻ hình vỏ sò mà Mẹ mang theo, giấu quanh mái hiên khô ráo. Skye đặt thẻ ở chỗ thấp, Zuma dùng mũi cún tìm thẻ sau chậu cây. Panda đếm được sáu tấm, rồi chia đều cho ba người chơi."},{"image":"page7.webp","audio":"elevenlabs-v4/audio/07.mp3","text":"Mưa tạnh, ánh sáng trở lại. Panda không vội chạy ra cát. Cậu kiểm tra chong chóng đã quay chậm, nhìn mặt sân vẫn còn ướt và hỏi Mẹ khi nào an toàn để ra ngoài. Mẹ gật đầu khi lối đi đã khô; Zuma nhắc cả nhóm chỉ chơi trên phần cát cao."},{"image":"page8.webp","audio":"elevenlabs-v4/audio/08.mp3","text":"Cuối buổi, Panda vẽ ba ô trong sổ: nắng nhạt, gió mạnh với mưa, rồi trời sáng. Cậu khoe với Skye và Zuma: “Dự đoán đầu của tớ chưa chắc đúng ngay, nhưng dấu hiệu mới đã giúp tớ đổi kế hoạch.” Mẹ ôm vai cậu. Trò săn kho báu có hai phiên bản và cả nhóm đều vui."},{"image":"page9.webp","audio":"elevenlabs-v4/audio/09.mp3","text":"Bài học cho bé. Hãy quan sát mây, gió và mưa trước khi quyết định chơi ngoài trời. Nói dự đoán theo kiểu “nếu… thì…” và sẵn sàng đổi kế hoạch khi thời tiết thay đổi. Khi trời xấu, vào nơi an toàn và tìm một cách chơi khác."}]},{"n":5,"title":"Bức thư đầu tiên của Panda","voiceLabel":"ElevenLabs · v4 · tốc độ tự nhiên","base":"Panda-story-5","cover":"cover.webp","slides":[{"image":"cover.webp","audio":"elevenlabs-v4/audio/00-cover.mp3","text":"Bức thư đầu tiên của Panda. Tập dùng chữ và hình để truyền đạt rõ ý, rồi kiểm tra người nhận đã hiểu chưa."},{"image":"page1.webp","audio":"elevenlabs-v4/audio/01.mp3","text":"Mẹ và Panda xếp những chiếc gối tròn trong góc đọc sách của trạm Lookout. Ryder đem tới một chồng sách tranh. Panda muốn mời Marshall đến xem cuốn sách về xe cứu hỏa. “Con viết thư mời được không?” cậu hỏi. Mẹ mỉm cười: “Được chứ. Con muốn Marshall biết những điều gì?”"},{"image":"page2.webp","audio":"elevenlabs-v4/audio/02.mp3","text":"Panda viết tên MARSHALL thật to rồi vẽ một quyển sách và một chiếc xe đỏ. Cậu chăm chú ngắm bức thư. “Xong rồi!” Cậu nhờ Ryder đưa thư đi. Nhưng Ryder nhìn tờ giấy và hỏi: “Bạn ấy sẽ biết gặp cậu ở đâu và lúc nào không?” Panda khựng lại. Trong thư mới chỉ có tên và hình vẽ."},{"image":"page3.webp","audio":"elevenlabs-v4/audio/03.mp3","text":"Mẹ đưa Panda xem một tấm thiệp mời ngắn. Hai mẹ con cùng tìm ba điều: mời ai, đến đâu, vào lúc nào. Panda chỉ từng phần trên thiệp, rồi tự nói: “Con còn thiếu chỗ gặp và giờ gặp.” Mẹ đặt thiệp xuống để Panda tự nghĩ cách thêm vào."},{"image":"page4.webp","audio":"elevenlabs-v4/audio/04.mp3","text":"Panda chưa viết được tất cả các từ. Cậu viết “GÓC SÁCH” theo mẫu Mẹ chỉ, vẽ chiếc gối tròn dễ nhận ra và một mặt đồng hồ có kim chỉ ba giờ. Ryder giúp cậu nhìn đồng hồ thật để kiểm tra. Panda thêm mũi tên từ cửa trạm tới góc sách. “Bây giờ chắc rõ rồi!” cậu nói."},{"image":"page5.webp","audio":"elevenlabs-v4/audio/05.mp3","text":"Marshall nhận thư, vui vẻ chạy tới sân trước trạm vào lúc ba giờ. Cậu nhìn quanh mà không thấy Panda. Bức vẽ chiếc gối tròn đã khiến Marshall tưởng đó là bánh xe ở sân tập! Marshall gọi: “Panda ơi, tớ đến rồi, cậu ở đâu?” Panda ngạc nhiên nhưng không trách bạn."},{"image":"page6.webp","audio":"elevenlabs-v4/audio/06.mp3","text":"Panda hỏi Marshall: “Cậu hiểu bức thư của tớ như thế nào?” Marshall kể lại điều mình đoán. Panda nhận ra tấm thiệp vẫn thiếu một mốc chỉ đường rõ ràng. Cậu dẫn Marshall đi qua cửa kính màu xanh, rẽ trái tới chiếc kệ sách. Ryder nghe và ghi nhớ đường đi. Mẹ để Panda tự giải thích hết."},{"image":"page7.webp","audio":"elevenlabs-v4/audio/07.mp3","text":"Panda lấy bút khác màu, vẽ cửa kính xanh và chiếc kệ ba tầng lên thư; cậu nối chúng bằng một đường mũi tên. Dưới hình đồng hồ, cậu viết thêm chữ “3 GIỜ” bằng cách nhìn mẫu trên đồng hồ treo tường. Cậu đưa thư cho Marshall: “Cậu thử nói lại xem sẽ đi đường nào?” Marshall kể đúng từng mốc."},{"image":"page8.webp","audio":"elevenlabs-v4/audio/08.mp3","text":"Ba giờ chiều hôm sau, Marshall tìm đúng góc sách. Panda chọn cuốn truyện xe cứu hỏa, còn Ryder và Mẹ ngồi nghe. Panda cười: “Một bức thư hay là bức thư giúp bạn hiểu điều mình muốn nói.” Marshall đáp: “Và nếu chưa rõ, tớ có thể hỏi!” Cả nhóm mở trang sách đầu tiên."},{"image":"page9.webp","audio":"elevenlabs-v4/audio/09.mp3","text":"Bài học cho bé. Chữ viết và hình vẽ đều giúp mình truyền đạt ý. Trước khi gửi lời mời, hãy kiểm tra người nhận cần biết ai, ở đâu và lúc nào. Nếu bạn hiểu khác, mình có thể hỏi lại rồi sửa cho rõ hơn."}]},{"n":6,"title":"Hai con đường đến đích","voiceLabel":"ElevenLabs · v4 · tốc độ tự nhiên","base":"Panda-story-6","cover":"cover.webp","slides":[{"image":"cover.webp","audio":"elevenlabs-v4/audio/00-cover.mp3","text":"Hai con đường đến đích. Lắng nghe các ý kiến khác nhau, chọn tiêu chí và kiểm tra trước khi quyết định."},{"image":"page1.webp","audio":"elevenlabs-v4/audio/01.mp3","text":"Panda cùng Chase và Rocky mang một chiếc chuông nhỏ đến điểm hẹn trên đồi thông để mở trò chơi tìm đường. Trên bản đồ có hai lối: đường lát đá đi vòng qua vườn và đường đất băng qua bãi cỏ. Chase muốn chọn đường lát đá. Rocky nghĩ đường đất ngắn hơn. Cả hai đều có lý do riêng."},{"image":"page2.webp","audio":"elevenlabs-v4/audio/02.mp3","text":"“Đường lát đá có biển chỉ dẫn, ít lạc,” Chase nói. Rocky đáp: “Nhưng đường đất giúp mình đến nhanh.” Panda nhìn lên bầu trời. Mưa đêm qua vẫn còn đọng thành vũng nhỏ. Cậu đề nghị: “Mình đừng chọn chỉ vì thích. Hãy xem đường nào an toàn, rồi mới xem đường nào nhanh.” Hai bạn đồng ý."},{"image":"page3.webp","audio":"elevenlabs-v4/audio/03.mp3","text":"Panda vẽ hai nét đường lên một tấm bảng nhỏ và đặt hai biểu tượng: chiếc khiên cho an toàn, đồng hồ cho thời gian. Chase quan sát lối lát đá từ chỗ đứng. Rocky dùng bánh xe đo nhỏ của mình lăn thử vài mét đầu đường đất. Panda ghi lại điều họ thật sự thấy, không điền theo phỏng đoán."},{"image":"page4.webp","audio":"elevenlabs-v4/audio/04.mp3","text":"Ba bạn đi một đoạn ngắn trên đường đất. Bùn mềm dính vào bánh xe đo. Rocky dừng ngay: “Nếu chở chuông qua đây, mình có thể trượt.” Panda dùng một cành cây khô chạm vào vũng bùn ở mép lối, rồi đứng lui lại. Cành cây lún khá sâu. Họ quay về ngã rẽ, không bước tiếp vào chỗ bùn."},{"image":"page5.webp","audio":"elevenlabs-v4/audio/05.mp3","text":"Lối lát đá khô và có biển mũi tên rõ. Chase vui vì dự đoán của mình đúng một phần. Nhưng Panda phát hiện một đoạn lát đá bị cành cây chắn ngang. Rocky dùng dụng cụ kẹp cơ khí từ ba lô dời cành nhỏ sang chỗ an toàn; Panda đứng ngoài khu vực làm việc và nhắc mọi người kiểm tra lại lối đi. Chặng đường thông suốt."},{"image":"page6.webp","audio":"elevenlabs-v4/audio/06.mp3","text":"Panda nhìn bảng ghi. Đường đất ngắn hơn nhưng còn bùn sâu. Đường lát đá dài hơn, nay đã thông và dễ đi. Rocky nói: “Tớ chỉ nhìn khoảng cách nên chưa nghĩ tới bùn.” Chase nói: “Tớ cũng suýt bỏ qua cành cây.” Panda kết luận: “Mình chọn lối lát đá hôm nay. Ngày khô ráo, mình có thể thử đường đất lần nữa.”"},{"image":"page7.webp","audio":"elevenlabs-v4/audio/07.mp3","text":"Panda cầm chiếc chuông, bước theo biển chỉ dẫn. Chase đi trước kiểm tra ngã rẽ; Rocky đi sau đẩy xe nhỏ chở đồ chơi. Cả nhóm đến đồi thông đúng giờ. Không ai phải thắng trong cuộc tranh luận; mỗi ý kiến đã giúp họ nhìn thêm một phần của vấn đề."},{"image":"page8.webp","audio":"elevenlabs-v4/audio/08.mp3","text":"Panda treo chuông lên cành thấp an toàn và rung một tiếng leng keng. Trò chơi bắt đầu. Cậu vẽ lên bản đồ một nét chấm cạnh đường đất: “Chỉ thử khi khô và có người lớn cùng đi.” Chase và Rocky cùng gật đầu. Ba bạn vui vì đã tìm được cách quyết định dựa trên điều mình kiểm tra."},{"image":"page9.webp","audio":"elevenlabs-v4/audio/09.mp3","text":"Bài học cho bé. Khi có hai ý kiến khác nhau, hãy nghe lý do của từng bạn. Chọn điều quan trọng cần kiểm tra, như sự an toàn, rồi so sánh những gì mình quan sát được. Hôm nay chọn một cách; khi điều kiện đổi, mình có thể xem lại."}]},{"n":7,"title":"Chiếc hộp bị móp","voiceLabel":"ElevenLabs · v4 · tốc độ tự nhiên","base":"Panda-story-7","cover":"cover.webp","slides":[{"image":"cover.webp","audio":"elevenlabs-v4/audio/00-cover.mp3","text":"Chiếc hộp bị móp. Trung thực, nhận trách nhiệm và cùng sửa sai bằng hành động."},{"image":"page1.webp","audio":"elevenlabs-v4/audio/01.mp3","text":"Bố giúp Panda, Rubble và Zuma chuẩn bị một mô hình bến nước cho ngày hội chơi. Chiếc hộp bìa xanh làm nhà kho nhỏ; Rubble xếp đường lên bến, Zuma đặt những chiếc thuyền đồ chơi ở mép nước giả. Panda nhận nhiệm vụ vẽ biển chỉ lối lên hộp. Bố để kéo đầu tròn và băng dính giấy trên bàn."},{"image":"page2.webp","audio":"elevenlabs-v4/audio/02.mp3","text":"Panda muốn nhìn mô hình từ trên cao nên định trèo lên ghế. Bố nhắc cậu dùng bục đứng an toàn. Panda xoay người để lấy bục; khuỷu tay cậu vô ý chạm vào chiếc hộp. Một góc hộp bị móp và mái bìa bung ra. Panda đứng sững. Rubble và Zuma đang ở phía bên kia bàn nên chưa nhìn thấy."},{"image":"page3.webp","audio":"elevenlabs-v4/audio/03.mp3","text":"Panda thử đặt mái che lên chỗ móp. Nhìn từ xa, hộp gần như bình thường, nhưng cậu biết nó sẽ sập khi có ai chạm vào. Bố bước tới, thấy cậu im lặng. “Có chuyện gì vậy con?” Bố hỏi. Panda hít sâu: “Con lỡ làm móp hộp. Con định che đi, nhưng như thế các bạn sẽ không biết nó yếu.”"},{"image":"page4.webp","audio":"elevenlabs-v4/audio/04.mp3","text":"Panda gọi Rubble và Zuma lại, chỉ góc móp: “Tớ lỡ làm hỏng chỗ này. Tớ xin lỗi và muốn cùng sửa.” Rubble buồn vì phải tháo đường lên bến. Zuma lo mái nhà sẽ đổ lên thuyền. Panda lắng nghe. Bố mang dụng cụ an toàn đến và để cậu đề xuất cách làm."},{"image":"page5.webp","audio":"elevenlabs-v4/audio/05.mp3","text":"Panda cắt một miếng bìa mỏng bằng kéo đầu tròn rồi dán lên góc hộp. Rubble thử đặt một viên gạch đồ chơi lên mái: mép hộp lại gập. “Miếng vá chưa đủ cứng,” Panda nhận ra. Cậu không đổ lỗi cho băng dính. Zuma đề nghị thử một thanh chống bên trong."},{"image":"page6.webp","audio":"elevenlabs-v4/audio/06.mp3","text":"Bố giúp cắt một thanh bìa dày theo kích thước Panda đo. Panda dán thanh chống vào góc trong, Rubble giữ hộp khỏi xê dịch, Zuma đưa từng đoạn băng dính giấy. Cả nhóm thử đặt lại mái rồi nhẹ tay chạm vào: mái đứng vững. Panda nói: “Cảm ơn các bạn đã giúp tớ sửa điều tớ làm hỏng.”"},{"image":"page7.webp","audio":"elevenlabs-v4/audio/07.mp3","text":"Rubble lắp lại đường lên bến. Zuma đẩy thuyền đồ chơi đi qua. Panda tự kiểm tra góc hộp và đặt tấm biển chỉ lối ở vị trí không che vết sửa. Đường không lung lay, mái không sập. Cậu vẫn nói với Bố: “Chỗ này đã được sửa, nhưng con muốn mọi người biết để dùng nhẹ tay.” Bố gật đầu."},{"image":"page8.webp","audio":"elevenlabs-v4/audio/08.mp3","text":"Các bạn nhỏ chơi mô hình bến nước. Panda kể: chiếc hộp từng bị móp, nhưng cả nhóm đã cùng gia cố. Rubble khoe con đường, Zuma cho thuyền chạy chuyến đầu. Bố mỉm cười. Panda thấy nhẹ lòng vì cậu đã nói thật và cùng các bạn sửa sai."},{"image":"page9.webp","audio":"elevenlabs-v4/audio/09.mp3","text":"Bài học cho bé. Khi mình vô ý làm hỏng thứ gì, hãy nói thật và nhận phần việc của mình. Lắng nghe điều người khác lo, rồi cùng tìm cách sửa và kiểm tra lại. Một lời xin lỗi chân thành đi cùng hành động."}]},{"n":8,"title":"Ngày Marshall không muốn cười","voiceLabel":"ElevenLabs · v4 · tốc độ tự nhiên","base":"Panda-story-8","cover":"cover.webp","slides":[{"image":"cover.webp","audio":"elevenlabs-v4/audio/00-cover.mp3","text":"Ngày Marshall không muốn cười. Hôm nay, Panda học cách hỏi và lắng nghe thay vì đoán hộ cảm xúc của bạn."},{"image":"page1.webp","audio":"elevenlabs-v4/audio/01.mp3","text":"Panda cùng Mẹ đến sân Vịnh Phiêu Lưu xem buổi thử chuông gió. Skye chuẩn bị những dải ruy băng hồng, còn Marshall treo các ống chuông lên một giá gỗ thấp. Panda thích nhất chiếc chuông kêu “ting” rất trong. Marshall hứa: “Lát nữa tớ sẽ làm người mở màn!”"},{"image":"page2.webp","audio":"elevenlabs-v4/audio/02.mp3","text":"Khi Marshall khẽ đẩy giá chuông, một ống chạm vào thanh gỗ và phát ra tiếng “cạch” thay vì tiếng “ting”. Marshall thử lại. Nó vẫn kêu “cạch”. Những bạn khác đang chờ, nên cậu cún tai đốm lùi sang bên và cúi đầu. Skye tiếp tục chuẩn bị sân khấu để mọi người có thời gian sửa."},{"image":"page3.webp","audio":"elevenlabs-v4/audio/03.mp3","text":"Panda chạy đến bên Mẹ. “Marshall buồn vì làm hỏng buổi biểu diễn, phải không Mẹ?” Mẹ nhìn Marshall rồi đáp: “Mẹ cũng chưa biết bạn đang nghĩ gì. Con có thể hỏi bạn, và cho bạn thời gian trả lời.” Panda gật đầu, đi chậm lại."},{"image":"page4.webp","audio":"elevenlabs-v4/audio/04.mp3","text":"Panda ngồi xuống ngang tầm mắt Marshall, giữ khoảng cách để bạn thấy thoải mái. “Tớ thấy cậu ngồi một mình. Cậu muốn kể chuyện gì vừa xảy ra không?” Marshall im lặng một lúc. Panda không nói thêm. Skye đứng gần đó nhưng cũng chờ."},{"image":"page5.webp","audio":"elevenlabs-v4/audio/05.mp3","text":"Cuối cùng Marshall nói: “Tớ không giận ai. Tớ hơi thất vọng vì đã tập rất nhiều. Tớ muốn được thử lại, nhưng trước tiên tớ cần ngồi yên một lát.” Panda đáp: “Ừ, tớ sẽ ngồi đây. Khi nào cậu muốn thử, cậu nói nhé.” Marshall thở ra nhẹ hơn."},{"image":"page6.webp","audio":"elevenlabs-v4/audio/06.mp3","text":"Một lát sau, Marshall tự đứng dậy. Panda hỏi: “Giờ cậu muốn tớ giúp nhìn xem ống chuông vướng ở đâu không?” Marshall gật đầu. Panda quan sát từ bên cạnh và thấy sợi dây của một ống bị xoắn, khiến nó đập vào thanh gỗ. Skye dùng mỏ kẹp cơ khí từ ba lô giữ giá vững; Panda tháo nhẹ nút xoắn bằng đôi tay của mình."},{"image":"page7.webp","audio":"elevenlabs-v4/audio/07.mp3","text":"Marshall dùng một chân trước chạm nhẹ vào chuông. “Ting!” Âm thanh vang lên trong trẻo. Cậu cười: “Cảm ơn hai bạn đã đợi tớ.” Skye đáp: “Cậu đã chọn lúc sẵn sàng rồi cùng sửa.” Panda nhận ra nếu cứ đoán Marshall cần được chọc cười ngay, cậu đã không nghe được điều bạn thật sự muốn."},{"image":"page8.webp","audio":"elevenlabs-v4/audio/08.mp3","text":"Buổi biểu diễn bắt đầu. Marshall tự tin đẩy giá chuông, những tiếng “ting” nối nhau trong gió. Panda cùng Mẹ và Skye lắng nghe. Khi Marshall nhìn xuống, Panda giơ ngón tay cái; Marshall vẫy đuôi. Mẹ khẽ nói: “Con đã hỏi, lắng nghe và để bạn tự chọn.” Panda cười: “Nhờ vậy cả nhóm mới biết cách giúp!”\n\nBài học cho bé: Thấy bạn im lặng, mình chưa thể biết chắc bạn đang buồn, giận hay chỉ cần nghỉ một chút. Hãy hỏi một câu nhẹ nhàng, lắng nghe câu trả lời và tôn trọng điều bạn cần. Khi bạn sẵn sàng, mình có thể cùng tìm cách giúp."},{"image":"page9.webp","audio":"elevenlabs-v4/audio/09.mp3","text":"Bài học cho bé. Thấy bạn im lặng, mình chưa thể biết chắc bạn đang buồn, giận hay chỉ cần nghỉ một chút. Hãy hỏi một câu nhẹ nhàng, lắng nghe câu trả lời và tôn trọng điều bạn cần. Khi bạn sẵn sàng, mình có thể cùng tìm cách giúp."}]},{"n":9,"title":"Xưởng đồ cũ hóa mới","voiceLabel":"ElevenLabs · v4 · tốc độ tự nhiên","base":"Panda-story-9","cover":"cover.webp","slides":[{"image":"cover.webp","audio":"elevenlabs-v4/audio/00-cover.mp3","text":"Xưởng đồ cũ hóa mới. Hôm nay, Panda học cách sáng tạo, thử lại và dùng đồ có trách nhiệm."},{"image":"page1.webp","audio":"elevenlabs-v4/audio/01.mp3","text":"Bố đưa Panda đến xưởng của Rocky. Trên bàn là các hộp sữa đã rửa sạch, bánh xe đồ chơi cũ và dây thun còn tốt. Ryder đang chuẩn bị một góc trao đổi sách cho trẻ em trong thị trấn. Panda đề nghị: “Con muốn làm một xe nhỏ để chở sách từ bàn này sang bàn kia!”"},{"image":"page2.webp","audio":"elevenlabs-v4/audio/02.mp3","text":"Bố và Panda kiểm tra từng món. Bố cất riêng mảnh nhựa nứt có cạnh sắc; Panda chọn một hộp giấy cứng, bốn bánh xe tròn, hai trục nhựa và băng dính giấy. Rocky nhắc: “Dùng lại đồ cũ phải xem nó còn sạch và chắc không.” Panda tự đặt những món đạt yêu cầu vào khay."},{"image":"page3.webp","audio":"elevenlabs-v4/audio/03.mp3","text":"Panda vẽ xe chở sách: hộp làm thùng, bánh xe gắn sát hai bên. Ryder hỏi: “Nếu đặt ba quyển sách vào, xe có chạy được không?” Panda nghĩ là được. Rocky giữ hộp, còn Panda gắn bánh và thử đẩy xe trên sàn phẳng."},{"image":"page4.webp","audio":"elevenlabs-v4/audio/04.mp3","text":"Chiếc xe lăn được nửa mét rồi nghiêng hẳn. Ba quyển sách trượt vào góc thùng. Panda thở dài: “Con tưởng xong rồi.” Bố không sửa hộ. Bố hỏi: “Con nhìn thấy bánh nào chạm sàn?” Panda cúi xuống: bánh trước bên trái đang lơ lửng."},{"image":"page5.webp","audio":"elevenlabs-v4/audio/05.mp3","text":"Panda bỏ sách ra và đẩy xe lần nữa. Xe vẫn nghiêng. Cậu đo khoảng cách từ đáy hộp tới hai đầu trục bằng một đoạn dây giấy: một bên dài hơn rõ rệt. “Vậy không phải tại sách. Trục này bị lệch!” Panda nói. Rocky gật đầu, đưa một miếng bìa sạch để Panda kê lại vị trí trục."},{"image":"page6.webp","audio":"elevenlabs-v4/audio/06.mp3","text":"Panda tháo trục lệch, đánh dấu hai điểm ngang nhau trên hộp rồi gắn lại bằng băng dính giấy. Rocky dùng dụng cụ cơ khí từ ba lô giữ hộp đứng yên. Lần này xe lăn thẳng khi còn trống. Panda đặt từng quyển sách vào giữa thùng, không dồn sang một góc."},{"image":"page7.webp","audio":"elevenlabs-v4/audio/07.mp3","text":"Panda đẩy xe qua lối đi ngắn giữa hai bàn. Xe đi chậm nhưng vững, cả ba quyển sách đều đến nơi. Ryder đón sách và nói: “Bản vẽ thứ hai tốt hơn vì con đã tìm ra nguyên nhân.” Panda cười: “Con không phải làm lại mọi thứ; con chỉ sửa chỗ bị lệch.”"},{"image":"page8.webp","audio":"elevenlabs-v4/audio/08.mp3","text":"Trẻ em đến chọn sách ở góc trao đổi. Panda dán một mảnh giấy hình chiếc lá lên xe để đánh dấu món đồ được dùng lại. Bố chụp ảnh chiếc xe và cùng Panda đem phần vật liệu dư cất vào đúng hộp. Rocky bảo: “Đồ cũ có thể bắt đầu một việc mới.” Panda nhìn chiếc xe nhỏ, nghĩ đến lần thử tiếp theo.\n\nBài học cho bé: Trước khi dùng lại đồ cũ, hãy chọn món sạch, chắc và an toàn cùng người lớn. Nếu ý tưởng đầu chưa hoạt động, quan sát điều gì sai, thử đổi một chi tiết rồi kiểm tra lại. Mỗi lần thử giúp mình hiểu và làm tốt hơn."},{"image":"page9.webp","audio":"elevenlabs-v4/audio/09.mp3","text":"Bài học cho bé. Trước khi dùng lại đồ cũ, hãy chọn món sạch, chắc và an toàn cùng người lớn. Nếu ý tưởng đầu chưa hoạt động, quan sát điều gì sai, thử đổi một chi tiết rồi kiểm tra lại. Mỗi lần thử giúp mình hiểu và làm tốt hơn."}]},{"n":10,"title":"Ba nhiệm vụ trước ngày vào lớp Một","voiceLabel":"ElevenLabs · v4 · tốc độ tự nhiên","base":"Panda-story-10","cover":"cover.webp","slides":[{"image":"cover.webp","audio":"elevenlabs-v4/audio/00-cover.mp3","text":"Ba nhiệm vụ trước ngày vào lớp Một. Hôm nay, Panda học cách tự chuẩn bị, dùng danh sách kiểm tra và bình tĩnh trước ngày mới."},{"image":"page1.webp","audio":"elevenlabs-v4/audio/01.mp3","text":"Chiều hai ngày trước buổi đầu vào lớp Một, Panda vẽ một ngôi sao lên tờ lịch. Bố và Mẹ ngồi bên cạnh; Chase, Rubble và Zuma ghé qua chúc cậu may mắn. Panda bảo: “Con có ba nhiệm vụ: soạn cặp, thử đường đến trường và tập chào cô!” Mẹ đưa cậu một tờ giấy trống để tự vẽ danh sách."},{"image":"page2.webp","audio":"elevenlabs-v4/audio/02.mp3","text":"Panda vẽ ba ô nhỏ: cặp, đường đi, lời chào. Cậu tự xếp hộp bút, vở và bình nước vào cặp. Rubble nhìn chiếc cặp hơi căng phồng. Panda mở ra, thấy hai món đồ chơi chiếm hết chỗ. Cậu chọn để chúng ở nhà và đóng cặp lại dễ dàng."},{"image":"page3.webp","audio":"elevenlabs-v4/audio/03.mp3","text":"Panda tự hào đánh dấu ô chiếc cặp. Chase hỏi: “Bình nước đã ở trong cặp chưa?” Panda chợt nhớ mình để bình trên bàn sau khi rót nước. Cậu hơi cuống: “Con quên rồi!” Bố chỉ vào tờ danh sách. Panda hít một hơi, mở cặp, đặt bình vào ngăn bên hông rồi kiểm tra lại từng món."},{"image":"page4.webp","audio":"elevenlabs-v4/audio/04.mp3","text":"Sáng hôm sau, Bố Mẹ cùng Panda đi bộ thử đường đến trường. Chase đi cạnh Bố, Rubble và Zuma theo sau. Tới ngã rẽ, Panda suýt chọn lối đến sân chơi vì thấy nó quen thuộc. Cậu dừng lại nhìn bức tường có tranh mặt trời, rồi chỉ lối có vạch qua đường và cổng trường màu xanh."},{"image":"page5.webp","audio":"elevenlabs-v4/audio/05.mp3","text":"Cả nhóm đến vạch qua đường. Panda nắm tay Mẹ, dừng ở mép vỉa hè, nhìn hai phía và chờ Bố xác nhận đường an toàn rồi mới bước. Chase khen cậu nhớ nguyên tắc. Panda đánh dấu ô thứ hai trên danh sách bằng một dấu tích xanh."},{"image":"page6.webp","audio":"elevenlabs-v4/audio/06.mp3","text":"Trước cổng trường, Panda tập nói: “Chào cô ạ, con tên là Panda.” Nhưng lúc tưởng tượng có nhiều bạn nhìn mình, cậu nói quá nhỏ. Zuma nhẹ nhàng bảo: “Tớ chưa nghe rõ. Cậu muốn thử lại không?” Panda gật đầu. Bố Mẹ đứng yên lắng nghe, không nói thay."},{"image":"page7.webp","audio":"elevenlabs-v4/audio/07.mp3","text":"Panda đứng thẳng, nhìn về phía cổng và nói vừa đủ nghe: “Con chào cô ạ. Con tên là Panda.” Rubble reo vui, Zuma vẫy đuôi, Chase gật đầu. Panda tự đánh dấu ô thứ ba. Cậu nói với Bố Mẹ: “Con vẫn hơi hồi hộp, nhưng con biết mình có thể thử lại.”"},{"image":"page8.webp","audio":"elevenlabs-v4/audio/08.mp3","text":"Chiều về, Panda đặt chiếc cặp cạnh cửa và dán danh sách lên tường thấp để sáng mai nhìn thấy. Cả nhà cùng kiểm tra ba dấu tích. Mẹ ôm vai cậu, Bố hỏi: “Ngày mai con muốn tự làm việc gì đầu tiên?” Panda đáp: “Con sẽ xem danh sách, mang cặp và tự chào cô.” Ngoài cửa, ba bạn cún cùng vẫy đuôi chúc ngủ ngon.\n\nBài học cho bé: Việc mới sẽ dễ hơn khi mình chia thành những bước nhỏ. Tự chuẩn bị, kiểm tra danh sách và sửa món còn thiếu giúp mình bình tĩnh. Nếu hồi hộp, mình có thể hít thở và thử lại; Bố Mẹ vẫn luôn ở bên để hỗ trợ."},{"image":"page9.webp","audio":"elevenlabs-v4/audio/09.mp3","text":"Bài học cho bé. Việc mới sẽ dễ hơn khi mình chia thành những bước nhỏ. Tự chuẩn bị, kiểm tra danh sách và sửa món còn thiếu giúp mình bình tĩnh. Nếu hồi hộp, mình có thể hít thở và thử lại; Bố Mẹ vẫn luôn ở bên để hỗ trợ."}]}];
const AUTO_ADVANCE_DELAY = 1000;

const library  = document.getElementById("library");
const reader   = document.getElementById("reader");
const grid     = document.getElementById("grid");
const img      = document.getElementById("slideImg");
const caption  = document.getElementById("caption");
const pageNum  = document.getElementById("pageNum");
const dots     = document.getElementById("dots");
const btnPlay  = document.getElementById("btnPlay");
const startOverlay = document.getElementById("startOverlay");
const endOverlay   = document.getElementById("endOverlay");
const audio = new Audio();
let screenWakeLock = null;
let wakeLockWanted = false;
let wakeLockPending = false;

async function keepScreenAwake() {
  wakeLockWanted = true;
  if (!navigator.wakeLock || document.visibilityState !== "visible" ||
      screenWakeLock || wakeLockPending) return;
  wakeLockPending = true;
  try {
    const lock = await navigator.wakeLock.request("screen");
    if (!wakeLockWanted || document.visibilityState !== "visible") {
      await lock.release();
    } else {
      screenWakeLock = lock;
      lock.addEventListener("release", () => {
        if (screenWakeLock === lock) screenWakeLock = null;
      });
    }
  } catch (_) {
    // The browser or device can refuse a wake lock; reading still works normally.
  } finally {
    wakeLockPending = false;
  }
}

function allowScreenSleep() {
  wakeLockWanted = false;
  const lock = screenWakeLock;
  screenWakeLock = null;
  if (lock) lock.release().catch(() => {});
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && wakeLockWanted) keepScreenAwake();
});

let storyIdx = 0;
let SLIDES = [];
let base = "";
let cur = 0;
let playing = false;
let advanceTimer = null;

/* ---------- Auto-open next story ---------- */
const AUTO_NEXT_SECONDS = 10;
let autoNextTimer = null;
const chkAutoNext = document.getElementById("chkAutoNext");
const autoNextCountdownEl = document.getElementById("autoNextCountdown");
chkAutoNext.checked = localStorage.getItem("autoNext") !== "0";   // default ON

function cancelAutoNext() {
  clearInterval(autoNextTimer);
  autoNextTimer = null;
  autoNextCountdownEl.textContent = "";
}

function goNextStory() {
  cancelAutoNext();
  openStory((storyIdx + 1) % STORIES.length);
  startOverlay.classList.remove("show");
  playing = true;
  go(0);
}

function startAutoNext() {
  cancelAutoNext();
  if (!chkAutoNext.checked || STORIES.length < 2) return;
  let remain = AUTO_NEXT_SECONDS;
  const nextTitle = STORIES[(storyIdx + 1) % STORIES.length].title;
  const tick = () => {
    if (remain <= 0) { goNextStory(); return; }
    autoNextCountdownEl.textContent = "➡️ Tự động mở “" + nextTitle + "” sau " + remain + "s…";
    remain--;
  };
  tick();
  autoNextTimer = setInterval(tick, 1000);
}

chkAutoNext.addEventListener("change", () => {
  localStorage.setItem("autoNext", chkAutoNext.checked ? "1" : "0");
  if (chkAutoNext.checked && endOverlay.classList.contains("show")) startAutoNext();
  else cancelAutoNext();
});

/* ---------- Library ---------- */
STORIES.forEach((st, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="thumb"><img loading="lazy" src="' + st.base + '/' + st.cover + '" alt="">' +
    '<span class="num">' + st.n + '</span></div>' +
    '<div class="cap">' + st.title + '</div>';
  card.addEventListener("click", () => openStory(i));
  grid.appendChild(card);
});

function openStory(i) {
  allowScreenSleep();
  storyIdx = i;
  const st = STORIES[i];
  SLIDES = st.slides;
  base = st.base;
  cur = 0;
  playing = false;
  clearTimeout(advanceTimer);
  cancelAutoNext();
  audio.pause();

  dots.innerHTML = "";
  SLIDES.forEach((_, k) => {
    const d = document.createElement("span");
    d.addEventListener("click", () => go(k, true));
    dots.appendChild(d);
  });

  document.getElementById("startCover").src = base + "/" + st.cover;
  document.getElementById("startTitle").textContent = st.title;
  document.getElementById("startSub").textContent =
    "Giọng kể: " + st.voiceLabel + " • " + (SLIDES.length - 1) + " trang";
  endOverlay.classList.remove("show");
  startOverlay.classList.add("show");
  btnPlay.textContent = "▶";

  render();
  library.classList.add("hidden");
  reader.classList.add("active");
  window.scrollTo(0, 0);
}

function goHome() {
  allowScreenSleep();
  playing = false;
  clearTimeout(advanceTimer);
  cancelAutoNext();
  audio.pause();
  btnPlay.textContent = "▶";
  reader.classList.remove("active");
  library.classList.remove("hidden");
  location.hash = "";
}

/* ---------- Player ---------- */
function render() {
  const s = SLIDES[cur];
  img.src = base + "/" + s.image;
  caption.textContent = s.text;
  caption.scrollTop = 0;
  pageNum.textContent = (cur === 0 ? "Bìa" : "Trang " + cur) + " / " + (SLIDES.length - 1);
  [...dots.children].forEach((d, i) => {
    d.className = i < cur ? "done" : i === cur ? "cur" : "";
  });
  if (cur + 1 < SLIDES.length) { (new Image()).src = base + "/" + SLIDES[cur + 1].image; }
}

function playCurrent() {
  clearTimeout(advanceTimer);
  keepScreenAwake();
  audio.src = base + "/" + SLIDES[cur].audio;
  audio.play().catch(() => {});
  btnPlay.textContent = "⏸";
}

function stopAudio() {
  clearTimeout(advanceTimer);
  audio.pause();
  allowScreenSleep();
  btnPlay.textContent = "▶";
}

function go(i, manual) {
  if (i < 0 || i >= SLIDES.length) return;
  cancelAutoNext();
  cur = i;
  endOverlay.classList.remove("show");
  render();
  if (playing || manual) playCurrent();
}

audio.addEventListener("ended", () => {
  if (!playing) { allowScreenSleep(); btnPlay.textContent = "▶"; return; }
  if (cur + 1 < SLIDES.length) {
    advanceTimer = setTimeout(() => go(cur + 1), AUTO_ADVANCE_DELAY);
  } else {
    playing = false;
    allowScreenSleep();
    btnPlay.textContent = "▶";
    endOverlay.classList.add("show");
    startAutoNext();
  }
});

/* ---------- Controls ---------- */
document.getElementById("btnStart").addEventListener("click", () => {
  startOverlay.classList.remove("show");
  playing = true;
  go(0);
});
document.getElementById("btnAgain").addEventListener("click", () => { playing = true; go(0); });
document.getElementById("btnLibrary").addEventListener("click", goHome);
document.getElementById("btnHome").addEventListener("click", goHome);
document.getElementById("btnNextStory").addEventListener("click", goNextStory);
document.getElementById("btnPrev").addEventListener("click", () => go(cur - 1, true));
document.getElementById("btnNext").addEventListener("click", () => go(cur + 1, true));
document.getElementById("tapPrev").addEventListener("click", () => go(cur - 1, true));
document.getElementById("tapNext").addEventListener("click", () => go(cur + 1, true));
document.getElementById("btnReplay").addEventListener("click", playCurrent);
document.getElementById("btnCaption").addEventListener("click", () => reader.classList.toggle("show-caption"));

btnPlay.addEventListener("click", () => {
  if (audio.paused) {
    playing = true;
    if (audio.src && !audio.ended) { keepScreenAwake(); audio.play(); btnPlay.textContent = "⏸"; }
    else playCurrent();
  } else {
    playing = false;
    stopAudio();
  }
});

document.addEventListener("keydown", (e) => {
  if (!reader.classList.contains("active")) return;
  if (e.key === "ArrowRight") go(cur + 1, true);
  else if (e.key === "ArrowLeft") go(cur - 1, true);
  else if (e.key === " ") { e.preventDefault(); btnPlay.click(); }
  else if (e.key === "Escape") goHome();
});

/* ---------- Deep link: index.html#story=3 ---------- */
function applyHash() {
  const m = (location.hash || "").match(/story=(\d+)/);
  if (m) {
    const idx = STORIES.findIndex(s => s.n === parseInt(m[1], 10));
    if (idx >= 0) openStory(idx);
  }
}
applyHash();
</script>
